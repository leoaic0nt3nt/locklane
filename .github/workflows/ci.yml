name: Build and verify
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: locklane-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: go test ./...
      - run: go vet ./...
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: python3 scripts/integration.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-proof
          path: qa/network-proof.json
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: locklane-packages
          path: dist/*
